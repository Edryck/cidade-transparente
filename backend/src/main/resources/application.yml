spring:
  application:
    name: cidade-transparente

  profiles:
    # dev por padrão para quem clonar o repositório rodar direto com os dados de demonstração
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cidade_transparente}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      # Schema é responsabilidade exclusiva do Flyway
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      # Anexos: mesmo limite do CHECK no banco (5 MB); acima disso o Spring responde 413
      max-file-size: 5MB
      max-request-size: 6MB

  data:
    web:
      pageable:
        max-page-size: 100

jwt:
  # Sem default de propósito: a aplicação não sobe sem JWT_SECRET definido
  secret: ${JWT_SECRET}
  # 2h: token curto limita o estrago de um vazamento (LGPD art. 46); o login é barato de refazer
  expiration: ${JWT_EXPIRATION:7200000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
