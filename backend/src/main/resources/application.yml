spring:
  application:
    name: cidade-transparente

  profiles:
    # dev por padrão para quem clonar o repositório rodar direto com os dados de demonstração
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cidade_transparente}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      # Schema é responsabilidade exclusiva do Flyway
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  # Sem default de propósito: a aplicação não sobe sem JWT_SECRET definido
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
