services:
  postgres:
    image: postgres:16-alpine
    container_name: cidade-transparente-db
    environment:
      POSTGRES_DB: cidade_transparente
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d cidade_transparente"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
